<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="characterForm">
        <h1>Create Your Character</h1>

        <input name="userid" type="hidden" value="1" /> <!-- Temporary hardcoded user -->

        <label>Name: <input name="name" required /></label>

        <label>Level: <input name="level" type="number" min="1" max="20" required /></label>

        <fieldset>
            <legend>Ability Scores</legend>
            <label>Strength: <input name="strength" type="number" min="1" max="20" required /></label>
            <label>Dexterity: <input name="dexterity" type="number" min="1" max="20" required /></label>
            <label>Constitution: <input name="constitution" type="number" min="1" max="20" required /></label>
            <label>Intelligence: <input name="intelligence" type="number" min="1" max="20" required /></label>
            <label>Wisdom: <input name="wisdom" type="number" min="1" max="20" required /></label>
            <label>Charisma: <input name="charisma" type="number" min="1" max="20" required /></label>
        </fieldset>

        <label>Race: <input name="race" required /></label>
        <label>Class: <input name="class" required /></label>
        <label>Background: <input name="background" required /></label>
        <label>Alignment: <input name="alignment" required /></label>

        <button type="submit">Create Character</button>
    </form>

    <script src="./createCharacter.js" type="module"></script>
</body>
</html>
